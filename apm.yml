dependencies:
  apm: []

rules:

  # ── Testing Enforcement ────────────────────────────────────────────────────
  - id: RULE-T1
    title: "Every new module must have a test file"
    severity: blocking
    description: >
      Every new file added under modules/ must have a corresponding
      tests/test_<name>.py created in the same PR. The test file must contain
      at minimum one import test and one behavioural test covering the primary
      function or class.

  - id: RULE-T2
    title: "Every new worker must have a start/stop lifecycle test"
    severity: blocking
    description: >
      Every new file added under workers/ must have at minimum a test that:
      (1) imports the worker class, (2) instantiates it, (3) calls start(),
      waits briefly, calls stop(), and asserts isRunning() is False.
      This catches hidden import errors in PyInstaller bundles.

  - id: RULE-T3
    title: "Every bug fix must include a regression test"
    severity: blocking
    description: >
      Every bug fix PR must include a new test that reproduces the original
      failure and verifies the fix. The test must fail on the code before the
      fix and pass after. No exceptions.

  - id: RULE-T4
    title: "Smoke test list must stay current"
    severity: blocking
    description: >
      app.py _smoke_test() must be updated whenever a new module or worker is
      added. The smoke test must import the module and verify it does not crash
      on import. A PR adding a module without updating _smoke_test() is incomplete.

  # ── Release Integrity ─────────────────────────────────────────────────────
  - id: RULE-R1
    title: "Use bump_version.py for all version bumps — never edit files manually"
    severity: blocking
    description: >
      To bump the version, run ONE command from the repo root:
        python bump_version.py X.Y.Z
      This updates all 13 tracked locations atomically and self-verifies by
      running tests/test_version_consistency.py. Never edit version strings
      manually across files — use the script every time without exception.
      The What's New section in ui/dashboard.py reads QApplication.applicationVersion()
      dynamically and requires no manual update.
    how_to_bump:
      - "python bump_version.py 1.60"
      - "git add -p  (review changes)"
      - "git commit -m \"chore: bump version to 1.60\""
      - "git tag v1.60 && git push && git push --tags"
    files_managed_by_script:
      - "app.py → app.setApplicationVersion(\"X.Y.Z\")"
      - "cli.py → _VERSION = \"X.Y.Z\""
      - "apm.yml → top-level version: X.Y.Z"
      - "installer.iss → #define MyAppVersion \"X.Y.Z\""
      - "build.bat → echo version string"
      - "build.sh → echo version string"
      - "README.md → badge/link + What's New header"
      - "tools/debug_launch.py → app.setApplicationVersion(\"X.Y.Z\")"
      - "modules/rest_api.py → \"version\" in /health endpoint"
      - ".github/winget/NetSentinel.NetSentinel.yaml → PackageVersion: X.Y.Z"
      - ".github/winget/NetSentinel.NetSentinel.installer.yaml → PackageVersion + installer URL"
      - ".github/winget/NetSentinel.NetSentinel.locale.en-US.yaml → PackageVersion: X.Y.Z"

  - id: RULE-R1b
    title: "Every version bump must include a README changelog entry for that version"
    severity: blocking
    description: >
      When bumping the version with bump_version.py, the README.md changelog section
      must already contain a ### vX.Y.Z header for the new version with at least one
      bullet describing what changed. bump_version.py updates the first changelog
      header it finds (count=1) — so the new version's entry must be the topmost one
      before running the bump.

      Correct workflow:
        1. Add a new ### vX.Y.Z section at the top of ## Changelog in README.md
           with bullets describing what changed.
        2. Run: python bump_version.py X.Y.Z
        3. The script promotes the header; all 7 consistency tests pass.

      What belongs in a changelog entry (small is not a reason to omit):
        - Any UI change a user would notice (icon, layout, new button, new page)
        - Any new file a contributor would use (scripts, generators, new modules)
        - Any bug fix that affected observable behaviour
        - Any tooling or build change that affects the release pipeline
      What to omit:
        - Pure internal refactors with no observable effect
        - The version bump commit itself (no self-referential bullet needed)

      The README changelog keeps only the last 3 versions. When adding a new entry,
      drop the oldest — move its content to BACKLOG.md Completed if worth archiving.

  - id: RULE-R2
    title: "Winget locale manifest must be full — never minimal"
    severity: blocking
    description: >
      Every winget submission (both static .github/winget/ and CI-generated)
      must include the complete locale fields: Description, Tags, Moniker,
      PublisherUrl, PublisherSupportUrl, PackageUrl, LicenseUrl, and
      ReleaseNotesUrl. The minimal 9-field skeleton loses community repo
      metadata on every release. The CI generate step must use the full template.

  - id: RULE-R4
    title: "MSIX Version format must be exactly 4 parts (X.Y.Z.0)"
    severity: blocking
    description: >
      The AppxManifest.xml Version attribute must be in 4-part format only: X.Y.Z.0
      (e.g., 1.5.8.0). The makeappx.exe packaging tool rejects 5-part versions (X.Y.Z.0.0).
      bump_version.py automatically generates the correct format: it appends .0 to the
      semantic version. Never edit AppxManifest.xml manually or use 5-part versions.
      The release.yml workflow also enforces this via the Patch version strings step.
    title: "MSIX staging must copy the onefile exe — never glob a directory"
    severity: blocking
    description: >
      NetSentinel is built as a PyInstaller onefile executable on all platforms.
      The Windows artifact is dist\NetSentinel.exe — a single file, NOT a directory.
      The MSIX staging step must use:
        Copy-Item "dist\NetSentinel.exe" "$stage\NetSentinel\NetSentinel.exe"
      Never use:
        Copy-Item -Recurse "dist\NetSentinel\*" "$stage\NetSentinel\"
      The latter path (dist\NetSentinel\) does not exist and the CI step will fail
      silently or throw. AppxManifest.xml expects Executable="NetSentinel\NetSentinel.exe"
      so the single exe must land at that path inside the staging layout.

  - id: RULE-R3
    title: "Ookla.Speedtest.CLI must be ExternalDependencies, not PackageDependencies"
    severity: blocking
    description: >
      Ookla.Speedtest.CLI must be declared as ExternalDependencies in all
      winget manifests. PackageDependencies causes winget to block the install
      if the package is not in the official winget index — a broken install
      is the highest-severity user-facing bug possible.

  # ── UX Baseline ───────────────────────────────────────────────────────────
  - id: RULE-UX1
    title: "New pages must show content within 200 ms"
    severity: required
    description: >
      Every new UI page must display meaningful content (cached data, last-known
      state, or a skeleton placeholder) within 200 ms of navigation. No blank
      panels while a worker starts. Use the MetricStore cache as the initial
      render source, then refresh via worker signal.

  - id: RULE-UX2
    title: "Destructive and slow actions must have a visible loading state"
    severity: required
    description: >
      Any action that takes more than 500 ms (network scan, speed test, file
      export, service restart) must show a visible in-progress indicator —
      spinner, progress bar, or disabled button with "Running…" label — before
      the operation starts. Never leave the UI in a silent waiting state.

  - id: RULE-UX3
    title: "Every scan result row must have a right-click context menu"
    severity: required
    description: >
      Every QTableWidget showing scan results must have a context menu
      (right-click) with at minimum: "Copy" (copies selected row as text)
      and "How to Fix" (opens a plain-English remediation panel or dialog).
      Use customContextMenuRequested signal — never override mousePressEvent.

  - id: RULE-UX4
    title: "Ctrl+F must always focus the sidebar search"
    severity: required
    description: >
      The global Ctrl+F shortcut must focus the sidebar search box from any
      page in the application. This is implemented via Dashboard._focus_nav_search()
      bound to QShortcut. New pages must not intercept or consume Ctrl+F.

  # ── Home User / Professional Dual Audience ────────────────────────────────
  - id: RULE-A1
    title: "Every feature must have a plain-English summary and a technical detail view"
    severity: required
    description: >
      Scan results must be presented at two levels: a plain-English summary
      (what it means, what to do) visible by default, and full technical detail
      (raw values, MACs, exact RTTs, OIDs) accessible via a collapsible section
      or "Details" button. Never hide data entirely — the professional user
      must be able to reach it without a separate tool.

  - id: RULE-A2
    title: "Error messages must be translated — no raw exceptions shown to users"
    severity: required
    description: >
      No raw Python exception (traceback, AttributeError, etc.) may ever appear
      in the UI. All worker error signals must be caught and translated to an
      actionable message: what failed, why it likely failed, and what the user
      should try next. Use a helper like _friendly_error(exc) → str in each page.

  - id: RULE-A3
    title: "Severity labels must use the canonical set only"
    severity: required
    description: >
      All severity / risk labels visible in the UI must be one of exactly:
      Info, Warning, High, Critical. No other strings. The existing RISK_COLORS
      / RISK_BG maps in ui/styles.py define the visual treatment. Do not invent
      new severity strings (e.g. "SEVERE", "NOTICE", "ALERT") — map them to
      the canonical four.

  # ── Long-term Architecture Health ─────────────────────────────────────────
  - id: RULE-AH1
    title: "Module files must not exceed 600 lines"
    severity: required
    description: >
      No single file under modules/ may grow beyond 600 lines. At that point
      the file must be split: extract cohesive sub-concerns into new sibling
      modules. Large files are a maintenance hazard and indicate mixed concerns.
      Measure with: wc -l modules/<name>.py or equivalent.

  - id: RULE-AH2
    title: "Workers must not block their thread for more than 5 seconds without a progress signal"
    severity: required
    description: >
      Any QThread worker that performs an operation expected to take more than
      5 seconds must emit a progress signal (progress(str) or status(str)) at
      least once every 5 seconds. This prevents the UI from appearing frozen
      and allows the user to cancel. Long polling loops must yield via msleep()
      and check a _running flag on each iteration.

  - id: RULE-AH3
    title: "No raw hex colour strings outside ui/styles.py and modules/colours.py"
    severity: blocking
    description: >
      Grep for raw hex strings (#[0-9a-fA-F]{6}) in any Python file outside
      ui/styles.py and modules/colours.py must return zero matches. This is a
      CI failure condition. All colours used in UI files must be imported from
      ui/styles.py. All colours used in module-layer exports (charts, HTML
      reports) must be imported from modules/colours.py. Add the colour to the
      appropriate file first if it does not exist.

  - id: RULE-AH4
    title: "Optional dependencies must be lazy-imported and have a graceful fallback"
    severity: required
    description: >
      Any dependency that is not universally available (nmap, scapy, speedtest,
      npcap-dependent libs) must not be imported at module level. Use lazy
      imports inside the function that needs them, wrapped in try/except
      ImportError. The fallback must degrade gracefully (return empty results,
      emit an error signal, or show a banner) — never crash on import.
      Example: speedtest-cli inside _run_speedtest_cli(), nmap inside port_scanner.

  # ── Winget Submission ─────────────────────────────────────────────────────
  - id: RULE-W1
    title: "Silent installs must never run nested winget calls"
    severity: blocking
    description: >
      The installer MUST NOT spawn `winget install` (or any long-running network
      process) during silent/automated installs. Winget validation sandboxes run
      the installer with /VERYSILENT; a nested winget call hangs and causes the
      outer installer to return E_ABORT (0x80004004 / -2147467260), failing
      submission every time.
      Three-layer defence:
      1. installer.iss [Run] Ookla entry: `Check: ShouldInstallOokla;`
         where ShouldInstallOokla() returns `not WizardSilent()`.
      2. installer.iss [Setup]: `PrivilegesRequiredOverridesAllowed = dialog commandline`
         so headless commandline installs can run without UAC elevation (which
         also returns E_ABORT in headless environments).
      3. All winget manifests (static .github/winget/ AND CI-generated): Silent
         and SilentWithProgress switches must include `/TASKS="!installookla"`
         to explicitly opt out of the Ookla task.
      Never remove any of these three defences independently.

  - id: RULE-W2
    title: "PrivilegesRequiredOverridesAllowed must include commandline"
    severity: blocking
    description: >
      installer.iss [Setup] must have:
        PrivilegesRequiredOverridesAllowed = dialog commandline
      Without `commandline`, Inno Setup attempts UAC elevation via ShellExecuteEx
      "runas" during silent commandline installs. In headless environments (winget
      validation, CI) that elevation fails and the installer exits with E_ABORT.
      The `commandline` keyword allows a non-elevated silent install to proceed
      as the current user when /VERYSILENT is passed from the command line.

  # ── Icon and Brand Assets ─────────────────────────────────────────────────
  - id: RULE-I1
    title: "Never hand-edit PNG or ICO icon files — regenerate via generate_icons.py"
    severity: blocking
    description: >
      All raster icon assets (PNG tiles, ICO) are generated programmatically from
      the embedded design in generate_icons.py. Never edit PNG/ICO files manually
      in an image editor — the changes will be overwritten on the next build and
      create inconsistency across sizes.

      To update any icon, edit generate_icons.py (the render_icon / render_wide /
      render_splash functions), then run:
        python generate_icons.py
      This regenerates all assets in assets/icons/ atomically.

      Output files managed by the script:
        assets/icons/NetSentinel.ico            — Windows app icon (16/24/32/48/64/128/256 px)
        assets/icons/netsentinel.png            — macOS / Linux app icon (512x512)
        assets/icons/StoreLogo.png              — MS Store / winget tile (50x50)
        assets/icons/Square44x44Logo.png        — Windows taskbar (44x44)
        assets/icons/Square71x71Logo.png        — Start menu small (71x71)
        assets/icons/Square150x150Logo.png      — Start menu medium (150x150)
        assets/icons/Square310x310Logo.png      — Start menu large (310x310)
        assets/icons/Wide310x150Logo.png        — Start menu wide (310x150)
        assets/icons/SplashScreen.png           — Inno Setup installer splash (620x300)

      The SVG files in assets/icons/ are reference artwork only (for designers /
      documentation); the build pipeline uses the PNG/ICO files directly.

  - id: RULE-I2
    title: "Icon design language must stay consistent — hexagon, shield, blue/cyan palette"
    severity: required
    description: >
      All NetSentinel icon assets must follow this design language. Deviating
      without updating this rule first is a review failure.

      Core elements (all required):
        Shape:     Pointy-top regular hexagon — the primary container
        Interior:  White shield outline centred inside the hexagon
        Palette:   Primary fill  #0078D4 (Windows blue)
                   Border        #005A9E (dark blue, hex outline only)
                   Accent rings  #00B4D8 (cyan, for ripple rings at ≥48 px)
                   Shield stroke white
        Ripple:    Three concentric cyan circles at ratios 0.722 / 0.537 / 0.333
                   of the hex vertex radius, at opacity 0.15 / 0.35 / 0.60
                   Only rendered at final sizes ≥ 48 px (visual noise below that)
        Background: Transparent for all square tiles and the tray icon
                    White (#FFFFFF) for the splash screen and wide tile
        Stroke:    2 px visual weight at any size; rounded joins and linecaps

      What must NOT change without a deliberate design decision:
        - No gradients on the hexagon fill (flat #0078D4 only)
        - No drop shadows or bevels
        - No emoji or bitmap textures inside any icon
        - The shield must remain centred and proportional (half-width = 0.370 × r,
          proportions defined in generate_icons.py render_icon())
        - Sidebar nav icons remain geometric Unicode only (RULE-25 / RULE-I4)

  - id: RULE-I3
    title: "Top-bar brand icon must use the netsentinel.png asset — never a letter fallback in production"
    severity: required
    description: >
      The 24×24 brand icon in the top-left of the application header
      (ui/dashboard.py _build_header) must render assets/icons/netsentinel.png
      scaled with Qt.TransformationMode.SmoothTransformation.

      The "N" letter fallback only exists for the edge case where the PNG file
      is missing (e.g. a partial checkout). It must never become the default.
      If the icon is missing in a build, fix the build — do not promote the
      fallback to the primary path.

      Path resolution must use the PyInstaller-aware pattern already established
      in _build_header:
        _base = Path(sys._MEIPASS) if getattr(sys, "frozen", False)
                else Path(__file__).parent.parent
        _pix  = QPixmap(str(_base / "assets" / "icons" / "netsentinel.png"))
      Never hardcode an absolute path or use a relative path without this guard.

  - id: RULE-I4
    title: "Sidebar nav icons must be geometric Unicode — never emoji"
    severity: blocking
    description: >
      All sidebar navigation item icons (the prefix character in _nav_add_page()
      and related helpers in ui/dashboard.py) must use geometric Unicode symbols
      only: ■ □ ▲ △ ● ○ ◆ ◇ ▶ ▷ ⬡ ⬢ ≡ ⌕ ⊕ etc.

      Emoji (🏠 🔍 🔔 🌐 etc.) must never be used as sidebar icons. Emoji render
      inconsistently across Windows versions, scale poorly in the 48 px collapsed
      sidebar, and break the visual consistency of the geometric icon strip.

      This rule applies to: ui/dashboard.py _nav_add_page() calls, section header
      strings, and any other sidebar label that includes a leading icon character.
      It does NOT apply to README.md, help text, or dialogs.

