site_name: NetSentinel
site_description: Network Security Scanner — Rogue Device Detector, STP Monitor & ISP Accountability Tool
site_url: https://ossianericson.github.io/netsentinel
repo_url: https://github.com/ossianericson/netsentinel
repo_name: ossianericson/netsentinel
edit_uri: edit/master/docs/

theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Contributing: contributing.md
  - Networking Guide: networking-guide.md
  - Privacy Policy: privacy-policy.md
  - Store Submission: store-submission.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ossianericson/netsentinel
