[mypy]
python_version = 3.11
ignore_missing_imports = True
no_strict_optional = True
warn_unused_ignores = False
show_error_codes = True

# Only check the pure-Python business logic layer (ARCH RULE 1).
# ui/ and workers/ are excluded — PyQt6 stubs are incomplete and produce
# too many false positives to be actionable.
files = modules/

# Silence entire layers that depend on PyQt6 or have incomplete stubs.
[mypy-ui.*]
ignore_errors = True

[mypy-workers.*]
ignore_errors = True

[mypy-tests.*]
ignore_errors = True

[mypy-tools.*]
ignore_errors = True
