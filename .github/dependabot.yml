version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 8          # Limit simultaneous PRs
    labels:
      - "dependencies"
      - "pip"

    # Better grouping to reduce PR spam
    groups:
      security-updates:
        applies-to: security-updates
        dependency-type: "production"

      minor-patch-updates:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"

    commit-message:
      prefix: "chore(deps)"

    # Ignore noisy or risky packages
    ignore:
      - dependency-name: "pyqt6"
      - dependency-name: "pyinstaller"
      - dependency-name: "matplotlib"
      - dependency-name: "pytest"           # Major version jumps break test suite assumptions
      - dependency-name: "keyring"          # OS keychain behaviour varies; test before bumping
      - dependency-name: "cryptography"     # Scapy compatibility; 44→48 spans 4 major versions

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(actions)"
