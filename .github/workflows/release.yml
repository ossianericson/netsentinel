name: Build & Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ── Windows ────────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pywin32

      - name: Pre-build smoke test
        run: python app.py --smoke

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

      - name: Build Windows executable
        run: |
          pyinstaller NetSentinel.spec
          pyinstaller NetSentinelCLI.spec
          pyinstaller NetSentinelSvc.spec

      - name: Post-build smoke test
        run: dist\NetSentinel.exe --smoke

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Get version from tag
        id: tag_version
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v', ''
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT

      - name: Patch installer.iss version
        shell: pwsh
        run: |
          $ver = "${{ steps.tag_version.outputs.VERSION }}"
          (Get-Content installer.iss) -replace '#define MyAppVersion\s+"[^"]+"', "#define MyAppVersion `"$ver`"" |
            Set-Content installer.iss

      - name: Build Inno Setup installer
        run: iscc installer.iss

      - name: Compute installer SHA256
        id: sha256
        shell: pwsh
        run: |
          $ver  = "${{ steps.tag_version.outputs.VERSION }}"
          $file = "dist\NetSentinel-Setup-${ver}.exe"
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          echo "SHA256=$hash" >> $env:GITHUB_OUTPUT
          echo "Installer SHA256: $hash"

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/NetSentinel-Setup-*.exe
          overwrite: true

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/NetSentinel.exe
          overwrite: true

      - name: Upload Windows CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-cli
          path: dist/NetSentinel-cli.exe
          overwrite: true

      - name: Upload Windows service artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-svc
          path: dist/NetSentinel-svc.exe
          overwrite: true

  # ── macOS ──────────────────────────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pre-build smoke test
        run: python app.py --smoke

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

      - name: Build macOS app
        run: |
          pyinstaller NetSentinel.spec
          pyinstaller NetSentinelCLI.spec
          mv dist/NetSentinel-cli dist/NetSentinel-cli-macOS

      - name: Post-build smoke test
        run: |
          BINARY="dist/NetSentinel.app/Contents/MacOS/NetSentinel"
          [ -f "$BINARY" ] || BINARY="dist/NetSentinel"
          "$BINARY" --smoke

      - name: Zip macOS app
        run: |
          cd dist
          zip -r NetSentinel-macOS.zip NetSentinel.app || \
            zip NetSentinel-macOS.zip NetSentinel

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: dist/NetSentinel-macOS.zip
          overwrite: true

      - name: Upload macOS CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-cli
          path: dist/NetSentinel-cli-macOS
          overwrite: true

  # ── Linux ──────────────────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-22.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libxcb-cursor0 libxcb1 libx11-6 \
            libgl1-mesa-glx libglib2.0-0 libdbus-1-3 \
            libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-xinerama0 libegl1 libegl-mesa0

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Pre-build smoke test
        run: python app.py --smoke

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

      - name: Build Linux binary
        run: |
          pyinstaller NetSentinel.spec
          pyinstaller NetSentinelCLI.spec
          mv dist/NetSentinel-cli dist/NetSentinel-cli-linux

      - name: Make executable
        run: |
          chmod +x dist/NetSentinel
          chmod +x dist/NetSentinel-cli-linux

      - name: Post-build smoke test
        run: dist/NetSentinel --smoke

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: dist/NetSentinel
          overwrite: true

      - name: Upload Linux CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-cli
          path: dist/NetSentinel-cli-linux
          overwrite: true

  # ── GitHub Release ─────────────────────────────────────────────────────────
  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-22.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "NetSentinel ${{ github.ref_name }}"
          draft: false
          prerelease: false
          body: |
            ## NetSentinel ${{ github.ref_name }}

            ### Recommended install

            ```powershell
            winget install NetSentinel.NetSentinel
            ```

            Or download manually:

            | Platform | File | Notes |
            |---|---|---|
            | **Windows** | `NetSentinel-Setup-*.exe` | **Recommended** — full installer, adds to Start Menu + PATH. Registers with winget. |
            | **Windows** | `NetSentinel.exe` | Portable GUI — right-click → Run as Administrator. |
            | **Windows** | `NetSentinel-cli.exe` | Headless CLI — no GUI required. |
            | **Windows** | `NetSentinel-svc.exe` | Background Windows service. |
            | **macOS** | `NetSentinel-macOS.zip` | GUI — unzip, right-click → Open. |
            | **macOS** | `NetSentinel-cli-macOS` | Headless CLI. |
            | **Linux** | `NetSentinel` | GUI — `chmod +x NetSentinel && sudo ./NetSentinel` |
            | **Linux** | `NetSentinel-cli-linux` | Headless CLI. |

            ### What it does
            One tool that replaces a drawer full of network utilities:
            - Rogue device fingerprinting with curated OUI registry (Google, TP-Link, Apple, Amazon, Samsung, LG, PlayStation, Nintendo, Xbox, Roku, Netgear, Asus)
            - STP/BPDU rogue Root Bridge detection
            - Broadcast & multicast storm analysis
            - IoT Behavioral Baseline — learns normal device traffic, alerts on deviations
            - Root Cause Correlator — distinguishes ISP fault from local network fault
            - Network Grade (A–F) across 8 dimensions — uptime, latency, jitter, DNS, speed, safety, STP, storm
            - ISP Accountability Report — HTML export with MTR hop table and outage log for support tickets
            - How-to-Fix context menus on every scan result
            - Hidden SSID and co-channel WiFi interference detection
            - Live ping + DNS latency correlation
            - On-demand diagnostics: speed test, DNS leak, traceroute, public IP
            - Long-term background connectivity logger with stability scoring
            - TCP port scanner, OS fingerprinter, CVE lookup, MTR, and more
            - HTML, JSON, CSV, Nmap XML report export
          files: |
            artifacts/windows-installer/NetSentinel-Setup-*.exe
            artifacts/windows-exe/NetSentinel.exe
            artifacts/windows-cli/NetSentinel-cli.exe
            artifacts/windows-svc/NetSentinel-svc.exe
            artifacts/macos-app/NetSentinel-macOS.zip
            artifacts/macos-cli/NetSentinel-cli-macOS
            artifacts/linux-binary/NetSentinel
            artifacts/linux-cli/NetSentinel-cli-linux

  # ── Winget submission ──────────────────────────────────────────────────────
  # Only runs after the GitHub Release job succeeds (needs: [release]).
  # A failed build or release will never reach this job.
  submit-winget:
    needs: [release]
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # Version comes directly from the tag — no API call needed.
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v', ''
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT
          echo "Resolved version: $ver"

      # ── Install wingetcreate ─────────────────────────────────────────────────
      - name: Install wingetcreate
        shell: pwsh
        run: winget install --id Microsoft.Wingetcreate --source winget --silent --accept-package-agreements --accept-source-agreements

      # ── Compute installer URL ────────────────────────────────────────────────
      - name: Build installer URL
        id: url
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.VERSION }}"
          $url = "https://github.com/${{ github.repository }}/releases/download/v${ver}/NetSentinel-Setup-${ver}.exe"
          echo "URL=$url" >> $env:GITHUB_OUTPUT
          echo "Installer URL: $url"

      # ── Download installer & compute SHA256 ─────────────────────────────────
      - name: Compute installer SHA256
        id: sha
        shell: pwsh
        run: |
          $url = "${{ steps.url.outputs.URL }}"
          $tmp = Join-Path $env:TEMP "NetSentinel-installer.exe"
          Invoke-WebRequest -Uri $url -OutFile $tmp -UseBasicParsing
          $hash = (Get-FileHash $tmp -Algorithm SHA256).Hash.ToUpper()
          Remove-Item $tmp -Force
          echo "HASH=$hash" >> $env:GITHUB_OUTPUT
          echo "Installer SHA256: $hash"

      # ── Write winget manifest files ──────────────────────────────────────────
      # WINGET_PAT must be a GitHub Personal Access Token (classic) with:
      #   repo  scope  →  for fork + PR creation in microsoft/winget-pkgs
      # Add it as a repository secret named WINGET_PAT.
      - name: Write manifest files
        shell: pwsh
        run: |
          $ver  = "${{ steps.version.outputs.VERSION }}"
          $url  = "${{ steps.url.outputs.URL }}"
          $hash = "${{ steps.sha.outputs.HASH }}"
          $dir  = "manifests\n\NetSentinel\NetSentinel\$ver"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null

          # Version manifest
          @(
            "PackageIdentifier: NetSentinel.NetSentinel",
            "PackageVersion: $ver",
            "DefaultLocale: en-US",
            "ManifestType: version",
            "ManifestVersion: 1.6.0"
          ) | Set-Content "$dir\NetSentinel.NetSentinel.yaml" -Encoding UTF8

          # Installer manifest
          @(
            "PackageIdentifier: NetSentinel.NetSentinel",
            "PackageVersion: $ver",
            "InstallerLocale: en-US",
            "InstallerType: inno",
            "Installers:",
            "- Architecture: x64",
            "  InstallerUrl: $url",
            "  InstallerSha256: $hash",
            "ManifestType: installer",
            "ManifestVersion: 1.6.0"
          ) | Set-Content "$dir\NetSentinel.NetSentinel.installer.yaml" -Encoding UTF8

          # Default locale manifest
          @(
            "PackageIdentifier: NetSentinel.NetSentinel",
            "PackageVersion: $ver",
            "PackageLocale: en-US",
            "Publisher: NetSentinel Project",
            "PackageName: NetSentinel",
            "License: MIT",
            "ShortDescription: Network monitoring and security tool for Windows",
            "ManifestType: defaultLocale",
            "ManifestVersion: 1.6.0"
          ) | Set-Content "$dir\NetSentinel.NetSentinel.locale.en-US.yaml" -Encoding UTF8

          echo "Manifests written to $dir"

      # ── Submit to winget-pkgs via wingetcreate ───────────────────────────────
      - name: Submit to winget-pkgs
        shell: pwsh
        env:
          WINGET_PAT: ${{ secrets.WINGET_PAT }}
        run: |
          $ver = "${{ steps.version.outputs.VERSION }}"
          $dir = "manifests\n\NetSentinel\NetSentinel\$ver"
          wingetcreate submit $dir --token $env:WINGET_PAT

      # ── Summary ──────────────────────────────────────────────────────────────
      - name: Print summary
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.VERSION }}"
          echo "### winget submission summary" >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $env:GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $env:GITHUB_STEP_SUMMARY
          echo "| Package | NetSentinel.NetSentinel |" >> $env:GITHUB_STEP_SUMMARY
          echo "| Version | $ver |" >> $env:GITHUB_STEP_SUMMARY
          echo "| Installer URL | ${{ steps.url.outputs.URL }} |" >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY
          echo "A PR has been opened in [microsoft/winget-pkgs](https://github.com/microsoft/winget-pkgs)." >> $env:GITHUB_STEP_SUMMARY
          echo "It will be auto-merged by the winget bot within ~24 hours after validation." >> $env:GITHUB_STEP_SUMMARY
