name: Build & Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write   # Sigstore OIDC for keyless cosign signing

jobs:
  # ── Windows ────────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pywin32

      - name: Get version from tag
        id: tag_version
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v', ''
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT

      - name: Patch version strings
        shell: pwsh
        run: |
          $ver = "${{ steps.tag_version.outputs.VERSION }}"
          # installer.iss
          (Get-Content installer.iss) -replace '#define MyAppVersion\s+"[^"]+"', "#define MyAppVersion `"$ver`"" |
            Set-Content installer.iss
          # app.py
          (Get-Content app.py) -replace 'setApplicationVersion\("[^"]+"\)', "setApplicationVersion(`"$ver`")" |
            Set-Content app.py
          # cli.py
          (Get-Content cli.py) -replace '_VERSION\s*=\s*"[^"]+"', "_VERSION = `"$ver`"" |
            Set-Content cli.py
          # packaging\AppxManifest.xml  — 4-part MSIX version (X.Y.Z.W format, not X.Y.Z.0.0)
          (Get-Content "packaging\AppxManifest.xml") -replace 'Version="[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+"', "Version=`"$ver.0`"" |
            Set-Content "packaging\AppxManifest.xml"
          echo "Patched to $ver"

      - name: Pre-build smoke test
        run: python app.py --smoke

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -v --tb=short --cov=. --cov-report=html:htmlcov

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-windows
          path: htmlcov/
          if-no-files-found: ignore

      - name: Exclude dist from Windows Defender
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "$pwd\dist"

      - name: Build Windows executable
        run: |
          pyinstaller NetSentinel.spec
          pyinstaller NetSentinelCLI.spec
          pyinstaller NetSentinelSvc.spec

      - name: Post-build smoke test
        run: .\dist\NetSentinel.exe --smoke

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build Inno Setup installer
        run: iscc installer.iss

      - name: Compute installer SHA256
        id: sha256
        shell: pwsh
        run: |
          $ver  = "${{ steps.tag_version.outputs.VERSION }}"
          $file = "dist\NetSentinel-Setup-${ver}.exe"
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          echo "SHA256=$hash" >> $env:GITHUB_OUTPUT
          echo "Installer SHA256: $hash"

      - name: Build MSIX package
        shell: pwsh
        run: |
          $ver = "${{ steps.tag_version.outputs.VERSION }}"

          # Staging layout: AppxManifest.xml + Assets\ + NetSentinel\
          $stage = "msix-staging"
          New-Item -ItemType Directory -Force "$stage\NetSentinel" | Out-Null
          New-Item -ItemType Directory -Force "$stage\Assets"      | Out-Null

          Copy-Item "dist\NetSentinel.exe" "$stage\NetSentinel\NetSentinel.exe"
          Copy-Item "assets\icons\StoreLogo.png"         "$stage\Assets\"
          Copy-Item "assets\icons\Square44x44Logo.png"   "$stage\Assets\"
          Copy-Item "assets\icons\Square71x71Logo.png"   "$stage\Assets\"
          Copy-Item "assets\icons\Square150x150Logo.png" "$stage\Assets\"
          Copy-Item "assets\icons\Square310x310Logo.png" "$stage\Assets\"
          Copy-Item "assets\icons\Wide310x150Logo.png"   "$stage\Assets\"
          Copy-Item "assets\icons\SplashScreen.png"      "$stage\Assets\"

          Copy-Item "packaging\AppxManifest.xml" "$stage\AppxManifest.xml"

          $makeappx = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" `
            -Filter "makeappx.exe" -Recurse |
            Where-Object { $_.FullName -match "x64" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName

          if (-not $makeappx) { throw "makeappx.exe not found" }
          & $makeappx pack /d $stage /p "dist\NetSentinel-$ver.msix" /nv
          Write-Host "MSIX built: dist\NetSentinel-$ver.msix"

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-msix
          path: dist/NetSentinel-*.msix
          overwrite: true

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: dist/NetSentinel-Setup-*.exe
          overwrite: true

      - name: Upload Windows service artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-svc
          path: dist/NetSentinel-svc.exe
          overwrite: true

  # ── macOS ──────────────────────────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pre-build smoke test
        run: python app.py --smoke

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -v --tb=short --cov=. --cov-report=html:htmlcov

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-macos
          path: htmlcov/
          if-no-files-found: ignore

      - name: Build macOS app
        run: |
          pyinstaller NetSentinel.spec
          pyinstaller NetSentinelCLI.spec
          mv dist/NetSentinel-cli dist/NetSentinel-cli-macOS

      - name: Post-build smoke test
        run: |
          BINARY="dist/NetSentinel.app/Contents/MacOS/NetSentinel"
          [ -f "$BINARY" ] || BINARY="dist/NetSentinel"
          "$BINARY" --smoke

      - name: Zip macOS app
        run: |
          cd dist
          zip -r NetSentinel-macOS.zip NetSentinel.app || \
            zip NetSentinel-macOS.zip NetSentinel

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-app
          path: dist/NetSentinel-macOS.zip
          overwrite: true

      - name: Upload macOS CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-cli
          path: dist/NetSentinel-cli-macOS
          overwrite: true

  # ── Linux ──────────────────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libxcb-cursor0 libxcb1 libx11-6 \
            libgl1-mesa-glx libglib2.0-0 libdbus-1-3 \
            libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-xinerama0 libegl1 libegl-mesa0

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Pre-build smoke test
        run: python app.py --smoke

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -v --tb=short --cov=. --cov-report=html:htmlcov

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-linux
          path: htmlcov/
          if-no-files-found: ignore

      - name: Build Linux binary
        run: |
          pyinstaller NetSentinel.spec
          pyinstaller NetSentinelCLI.spec
          mv dist/NetSentinel-cli dist/NetSentinel-cli-linux

      - name: Make executable
        run: |
          chmod +x dist/NetSentinel
          chmod +x dist/NetSentinel-cli-linux

      - name: Post-build smoke test
        run: dist/NetSentinel --smoke

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-binary
          path: dist/NetSentinel
          overwrite: true

      - name: Upload Linux CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-cli
          path: dist/NetSentinel-cli-linux
          overwrite: true

  # ── GitHub Release ─────────────────────────────────────────────────────────
  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write   # Sigstore OIDC for keyless cosign signing
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/

      - name: Resolve version
        id: ver
        run: |
          VER="${{ github.ref_name }}"
          VER="${VER#v}"
          echo "VERSION=$VER" >> "$GITHUB_OUTPUT"

      - name: Generate SHA256SUMS.txt
        run: |
          VER="${{ steps.ver.outputs.VERSION }}"
          cd artifacts
          # Collect all release files into a flat list and hash them
          find . -type f \( \
            -name "NetSentinel-Setup-*.exe" \
            -o -name "NetSentinel-*.msix" \
            -o -name "NetSentinel-svc.exe" \
            -o -name "NetSentinel-macOS.zip" \
            -o -name "NetSentinel-cli-macOS" \
            -o -name "NetSentinel" \
            -o -name "NetSentinel-cli-linux" \
          \) | while read -r f; do
            sha256sum "$f" | awk -v base="$(basename "$f")" '{print $1 "  " base}'
          done | sort > ../SHA256SUMS.txt
          echo "Generated SHA256SUMS.txt:"
          cat ../SHA256SUMS.txt

      - name: Sign Windows installer with cosign
        run: |
          VER="${{ steps.ver.outputs.VERSION }}"
          INSTALLER="artifacts/windows-installer/NetSentinel-Setup-${VER}.exe"
          if [ -f "$INSTALLER" ]; then
            cosign sign-blob \
              --yes \
              --bundle "NetSentinel-Setup-${VER}.exe.bundle" \
              "$INSTALLER"
            echo "Signed: $INSTALLER"
          else
            echo "Installer not found — skipping cosign"
          fi

      - name: Sign MSIX artifact with cosign
        run: |
          VER="${{ steps.ver.outputs.VERSION }}"
          MSIX="artifacts/windows-msix/NetSentinel-${VER}.msix"
          if [ -f "$MSIX" ]; then
            cosign sign-blob \
              --yes \
              --bundle "NetSentinel-${VER}.msix.bundle" \
              "$MSIX"
            echo "Signed: $MSIX"
          else
            echo "MSIX not found — skipping cosign"
          fi

      - name: Create GitHub Release
        id: gh_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: "NetSentinel ${{ github.ref_name }}"
          draft: false
          prerelease: false
          body: |
            ## NetSentinel ${{ github.ref_name }}

            ### Recommended install

            ```powershell
            winget install NetSentinel.NetSentinel
            ```

            Or download manually:

            | Platform | File | Notes |
            |---|---|---|
            | **Windows** | `NetSentinel-Setup-*.exe` | Installer — adds to Start Menu + PATH. Use winget (above) instead if possible. |
            | **Windows** | `NetSentinel-svc.exe` | Background Windows service (not in winget). |
            | **macOS** | `NetSentinel-macOS.zip` | GUI — unzip, right-click → Open. |
            | **macOS** | `NetSentinel-cli-macOS` | Headless CLI. |
            | **Linux** | `NetSentinel` | GUI — `chmod +x NetSentinel && sudo ./NetSentinel` |
            | **Linux** | `NetSentinel-cli-linux` | Headless CLI. |

            ### What it does
            One tool that replaces a drawer full of network utilities:
            - Rogue device fingerprinting with curated OUI registry (Google, TP-Link, Apple, Amazon, Samsung, LG, PlayStation, Nintendo, Xbox, Roku, Netgear, Asus)
            - STP/BPDU rogue Root Bridge detection
            - Broadcast & multicast storm analysis
            - IoT Behavioral Baseline — learns normal device traffic, alerts on deviations
            - Root Cause Correlator — distinguishes ISP fault from local network fault
            - Network Grade (A–F) across 8 dimensions — uptime, latency, jitter, DNS, speed, safety, STP, storm
            - ISP Accountability Report — HTML export with MTR hop table and outage log for support tickets
            - How-to-Fix context menus on every scan result
            - Hidden SSID and co-channel WiFi interference detection
            - Live ping + DNS latency correlation
            - On-demand diagnostics: speed test, DNS leak, traceroute, public IP
            - Long-term background connectivity logger with stability scoring
            - TCP port scanner, OS fingerprinter, CVE lookup, MTR, and more
            - HTML, JSON, CSV, Nmap XML report export
          files: |
            artifacts/windows-installer/NetSentinel-Setup-*.exe
            artifacts/windows-msix/NetSentinel-*.msix
            artifacts/windows-svc/NetSentinel-svc.exe
            artifacts/macos-app/NetSentinel-macOS.zip
            artifacts/macos-cli/NetSentinel-cli-macOS
            artifacts/linux-binary/NetSentinel
            artifacts/linux-cli/NetSentinel-cli-linux
            SHA256SUMS.txt
            NetSentinel-Setup-*.exe.bundle
            NetSentinel-*.msix.bundle

      - name: Submit to VirusTotal
        id: vt
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          VER="${{ steps.ver.outputs.VERSION }}"
          DL_URL="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/NetSentinel-Setup-${VER}.exe"
          python scripts/vt_scan.py "$DL_URL"

      - name: Prepend security section to release body
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${{ steps.ver.outputs.VERSION }}"
          RELEASE_ID="${{ steps.gh_release.outputs.id }}"
          SHA256_URL="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/SHA256SUMS.txt"
          BUNDLE="NetSentinel-Setup-${VER}.exe.bundle"
          MSIX_BUNDLE="NetSentinel-${VER}.msix.bundle"
          VT_PERMALINK="${{ steps.vt.outputs.VT_PERMALINK }}"

          ARGS="$RELEASE_ID $VER $SHA256_URL --bundle-name $BUNDLE --msix-bundle-name $MSIX_BUNDLE"
          if [ -n "$VT_PERMALINK" ]; then
            ARGS="$ARGS --vt-permalink $VT_PERMALINK"
          fi

          python scripts/update_release_body.py $ARGS

  # ── Winget submission ──────────────────────────────────────────────────────
  # Only runs after the GitHub Release job succeeds (needs: [release]).
  # A failed build or release will never reach this job.
  submit-winget:
    needs: [release]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      # Version comes directly from the tag — no API call needed.
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v', ''
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT
          echo "Resolved version: $ver"

      # ── Install wingetcreate ─────────────────────────────────────────────────
      - name: Install wingetcreate
        shell: pwsh
        run: winget install --id Microsoft.Wingetcreate --source winget --silent --accept-package-agreements --accept-source-agreements

      # ── Compute installer URL ────────────────────────────────────────────────
      - name: Build installer URL
        id: url
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.VERSION }}"
          $url = "https://github.com/${{ github.repository }}/releases/download/v${ver}/NetSentinel-Setup-${ver}.exe"
          echo "URL=$url" >> $env:GITHUB_OUTPUT
          echo "Installer URL: $url"

      # ── Download installer & compute SHA256 ─────────────────────────────────
      - name: Compute installer SHA256
        id: sha
        shell: pwsh
        run: |
          $url = "${{ steps.url.outputs.URL }}"
          $tmp = Join-Path $env:TEMP "NetSentinel-installer.exe"
          Invoke-WebRequest -Uri $url -OutFile $tmp -UseBasicParsing
          $hash = (Get-FileHash $tmp -Algorithm SHA256).Hash.ToUpper()
          Remove-Item $tmp -Force
          echo "HASH=$hash" >> $env:GITHUB_OUTPUT
          echo "Installer SHA256: $hash"

      # ── Write winget manifest files ──────────────────────────────────────────
      # WINGET_PAT must be a GitHub Personal Access Token (classic) with:
      #   repo  scope  →  for fork + PR creation in microsoft/winget-pkgs
      # Add it as a repository secret named WINGET_PAT.
      - name: Write manifest files
        shell: pwsh
        run: |
          $ver  = "${{ steps.version.outputs.VERSION }}"
          $url  = "${{ steps.url.outputs.URL }}"
          $hash = "${{ steps.sha.outputs.HASH }}"
          $dir  = "manifests\n\NetSentinel\NetSentinel\$ver"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null

          # Version manifest
          @(
            "# yaml-language-server: `$schema=https://aka.ms/winget-manifest.version.1.12.0.schema.json",
            "PackageIdentifier: NetSentinel.NetSentinel",
            "PackageVersion: $ver",
            "DefaultLocale: en-US",
            "ManifestType: version",
            "ManifestVersion: 1.12.0"
          ) | Set-Content "$dir\NetSentinel.NetSentinel.yaml" -Encoding UTF8

          # Installer manifest
          @(
            "# yaml-language-server: `$schema=https://aka.ms/winget-manifest.installer.1.12.0.schema.json",
            "PackageIdentifier: NetSentinel.NetSentinel",
            "PackageVersion: $ver",
            "InstallerLocale: en-US",
            "InstallerType: inno",
            "Scope: machine",
            "InstallModes:",
            "- interactive",
            "- silent",
            "UpgradeBehavior: install",
            "InstallerSwitches:",
            "  Silent: /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /TASKS=`"!installookla`"",
            "  SilentWithProgress: /SILENT /SUPPRESSMSGBOXES /NORESTART /TASKS=`"!installookla`"",
            "  Log: /`"{localappdata}\NetSentinel\install.log`"",
            "Installers:",
            "- Architecture: x64",
            "  InstallerUrl: $url",
            "  InstallerSha256: $hash",
            "  InstallerProductCode: com.netsentinel.app_is1",
            "ManifestType: installer",
            "ManifestVersion: 1.12.0"
          ) | Set-Content "$dir\NetSentinel.NetSentinel.installer.yaml" -Encoding UTF8

          # Default locale manifest — full rich metadata, mirrors the static file
          @(
            "# yaml-language-server: `$schema=https://aka.ms/winget-manifest.defaultLocale.1.12.0.schema.json",
            "PackageIdentifier: NetSentinel.NetSentinel",
            "PackageVersion: $ver",
            "PackageLocale: en-US",
            "Publisher: NetSentinel Project",
            "PublisherUrl: https://github.com/ossianericson/netsentinel",
            "PublisherSupportUrl: https://github.com/ossianericson/netsentinel/issues",
            "PackageName: NetSentinel",
            "PackageUrl: https://github.com/ossianericson/netsentinel",
            "License: MIT",
            "LicenseUrl: https://raw.githubusercontent.com/ossianericson/netsentinel/main/LICENSE",
            "PrivacyUrl: https://github.com/ossianericson/netsentinel/blob/main/PRIVACY.md",
            "ShortDescription: Professional network monitor — LAN scanner, security audit, 5G modem and mesh router integration",
            "Description: |-",
            "  NetSentinel is a professional-grade network security scanner and monitor for Windows,",
            "  targeting IT administrators, home lab users, and students learning network concepts.",
            "  It replaces a collection of separate utilities with one integrated desktop application:",
            "",
            "    • Device Inventory — ARP + mDNS + NetBIOS + DHCP scan; OUI fingerprinting identifies",
            "      cameras, smart speakers, routers, and IoT sensors by MAC address",
            "    • 5G Modem Monitor — live SINR, RSRP, RSRQ, band, and cell ID from ZTE MC889 modems;",
            "      signal history logged alongside every speed test result",
            "    • Mesh Router Monitor — TP-Link Deco XE75 node signal stats and topology;",
            "      enriches device inventory with real hostnames from your mesh network",
            "    • Hardware Integration — USB, serial, and GPIO device detection; extend the app",
            "      with physical sensors and network hardware",
            "    • Rogue Bridge Detector — captures 802.1D/RSTP BPDUs; flags devices stealing the",
            "      Root Bridge role and causing periodic 15-45 second network outages",
            "    • Broadcast Storm Analyser — measures broadcast/multicast rates in real time;",
            "      identifies the flooding device with packet-level evidence",
            "    • Speed Test — three-tier: Ookla CLI (1 Gbps+) then speedtest-cli (8 threads) then",
            "      pure-Python (16 TCP streams); each result captures a full modem signal snapshot",
            "    • Security Audit — SYN/UDP port scan, OS fingerprint, CVE lookup, TLS checker,",
            "      credential test (SSH/SMB/FTP/Telnet), threat intelligence, and risk scorer",
            "    • IoT Behavioral Baseline — learns normal traffic patterns; alerts when a device",
            "      contacts unexpected hosts or starts scanning",
            "    • What's Wrong? Diagnosis — symptom tiles trigger a sequenced scan; results",
            "      delivered as plain-English findings with root-cause correlation",
            "    • Log Hub — unified view: network RTT, 5G modem, mesh, syslog, and SNMP traps",
            "    • Protocol Visualizer — animated ARP/DNS/TCP/DHCP/STP diagrams from real scan data",
            "    • Lab Mode — guided CompTIA Network+/CCNA exercises with exportable HTML results",
            "    • MQTT / Home Assistant — Discovery payloads, configurable broker, keychain credentials",
            "    • REST API — read-only Flask API on localhost; API key stored in OS keychain",
            "    • WiFi Heatmap — floor plan import, IDW interpolation, PNG export",
            "    • Network Documentation — one-click HTML/Markdown snapshot of full network state",
            "    • Automation Hooks — shell commands triggered by alert and scan events",
            "",
            "  Most active scan features require Administrator privileges.",
            "  Install Npcap (https://npcap.com) for STP, storm, ARP watch, and 802.11 monitor mode.",
            "Moniker: netsentinel",
            "Tags:",
            "- network",
            "- security",
            "- scanner",
            "- monitoring",
            "- diagnostics",
            "- lan",
            "- wifi",
            "- dns",
            "- iot",
            "- port-scanner",
            "- cve",
            "- speed-test",
            "- packet-capture",
            "- mqtt",
            "- home-assistant",
            "- network-health",
            "ReleaseNotesUrl: https://github.com/ossianericson/netsentinel/releases/tag/v$ver",
            "ManifestType: defaultLocale",
            "ManifestVersion: 1.12.0"
          ) | Set-Content "$dir\NetSentinel.NetSentinel.locale.en-US.yaml" -Encoding UTF8

          echo "Manifests written to $dir"

      # ── Submit to winget-pkgs via wingetcreate ───────────────────────────────
      - name: Submit to winget-pkgs
        shell: pwsh
        env:
          WINGET_PAT: ${{ secrets.WINGET_PAT }}
        run: |
          $ver = "${{ steps.version.outputs.VERSION }}"
          $dir = "manifests\n\NetSentinel\NetSentinel\$ver"
          wingetcreate submit $dir --token $env:WINGET_PAT

      # ── Summary ──────────────────────────────────────────────────────────────
      - name: Print summary
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.VERSION }}"
          echo "### winget submission summary" >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $env:GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $env:GITHUB_STEP_SUMMARY
          echo "| Package | NetSentinel.NetSentinel |" >> $env:GITHUB_STEP_SUMMARY
          echo "| Version | $ver |" >> $env:GITHUB_STEP_SUMMARY
          echo "| Installer URL | ${{ steps.url.outputs.URL }} |" >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY
          echo "A PR has been opened in [microsoft/winget-pkgs](https://github.com/microsoft/winget-pkgs)." >> $env:GITHUB_STEP_SUMMARY
          echo "It will be auto-merged by the winget bot within ~24 hours after validation." >> $env:GITHUB_STEP_SUMMARY
