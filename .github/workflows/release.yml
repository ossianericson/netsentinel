name: Build & Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write   # Sigstore OIDC for keyless cosign signing

jobs:
  # ── Windows ────────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pywin32

      - name: Get version from tag
        id: tag_version
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v', ''
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT

      - name: Patch version strings
        shell: pwsh
        run: |
          $ver = "${{ steps.tag_version.outputs.VERSION }}"
          # installer.iss
          (Get-Content installer.iss) -replace '#define MyAppVersion\s+"[^"]+"', "#define MyAppVersion `"$ver`"" |
            Set-Content installer.iss
          # app.py
          (Get-Content app.py) -replace 'setApplicationVersion\("[^"]+"\)', "setApplicationVersion(`"$ver`")" |
            Set-Content app.py
          # cli.py
          (Get-Content cli.py) -replace '_VERSION\s*=\s*"[^"]+"', "_VERSION = `"$ver`"" |
            Set-Content cli.py
          # packaging\AppxManifest.xml — 4-part MSIX version (X.Y.Z.0)
          # Anchored with ^ so it only matches the Identity element's Version= line,
          # not MinVersion= or MaxVersionTested= in the TargetDeviceFamily element.
          (Get-Content "packaging\AppxManifest.xml") -replace '^\s+Version="[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+"', "    Version=`"$ver.0`"" |
            Set-Content "packaging\AppxManifest.xml"
          echo "Patched to $ver"

      - name: Pre-build smoke test
        run: python app.py --smoke

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -v --tb=short --cov=. --cov-report=html:htmlcov

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-windows
          path: htmlcov/
          if-no-files-found: ignore

      - name: Exclude dist from Windows Defender
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "$pwd\dist"

      - name: Build Windows executable
        run: |
          pyinstaller NetSentinel.spec
          pyinstaller NetSentinelCLI.spec
          pyinstaller NetSentinelSvc.spec

      - name: Post-build smoke test
        run: .\dist\NetSentinel.exe --smoke

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build Inno Setup installer
        run: iscc installer.iss

      - name: Compute installer SHA256
        id: sha256
        shell: pwsh
        run: |
          $ver  = "${{ steps.tag_version.outputs.VERSION }}"
          $file = "dist\NetSentinel-Setup-${ver}.exe"
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          echo "SHA256=$hash" >> $env:GITHUB_OUTPUT
          echo "Installer SHA256: $hash"

      - name: Build MSIX package
        shell: pwsh
        run: |
          $ver = "${{ steps.tag_version.outputs.VERSION }}"

          $stage = "msix-staging"
          New-Item -ItemType Directory -Force "$stage\NetSentinel" | Out-Null
          New-Item -ItemType Directory -Force "$stage\Assets"      | Out-Null

          Copy-Item "dist\NetSentinel.exe"                "$stage\NetSentinel\NetSentinel.exe"
          Copy-Item "assets\icons\StoreLogo.png"          "$stage\Assets\"
          Copy-Item "assets\icons\Square44x44Logo.png"    "$stage\Assets\"
          Copy-Item "assets\icons\Square71x71Logo.png"    "$stage\Assets\"
          Copy-Item "assets\icons\Square150x150Logo.png"  "$stage\Assets\"
          Copy-Item "assets\icons\Square310x310Logo.png"  "$stage\Assets\"
          Copy-Item "assets\icons\Wide310x150Logo.png"    "$stage\Assets\"
          Copy-Item "assets\icons\SplashScreen.png"       "$stage\Assets\"
          Copy-Item "packaging\AppxManifest.xml"          "$stage\AppxManifest.xml"

          $makeappx = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" `
            -Filter "makeappx.exe" -Recurse |
            Where-Object { $_.FullName -match "x64" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName

          if (-not $makeappx) { throw "makeappx.exe not found" }
          & $makeappx pack /d $stage /p "dist\NetSentinel-$ver.msix" /nv
          Write-Host "MSIX built: dist\NetSentinel-$ver.msix"

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-msix
          path: dist/NetSentinel-*.msix
          overwrite: true

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: dist/NetSentinel-Setup-*.exe
          overwrite: true

      - name: Upload Windows service artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-svc
          path: dist/NetSentinel-svc.exe
          overwrite: true

  # ── macOS ──────────────────────────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pre-build smoke test
        run: python app.py --smoke

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -v --tb=short --cov=. --cov-report=html:htmlcov

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-macos
          path: htmlcov/
          if-no-files-found: ignore

      - name: Build macOS app
        run: |
          pyinstaller NetSentinel.spec
          pyinstaller NetSentinelCLI.spec
          mv dist/NetSentinel-cli dist/NetSentinel-cli-macOS

      - name: Post-build smoke test
        run: |
          BINARY="dist/NetSentinel.app/Contents/MacOS/NetSentinel"
          [ -f "$BINARY" ] || BINARY="dist/NetSentinel"
          "$BINARY" --smoke

      - name: Zip macOS app
        run: |
          cd dist
          zip -r NetSentinel-macOS.zip NetSentinel.app || \
            zip NetSentinel-macOS.zip NetSentinel

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-app
          path: dist/NetSentinel-macOS.zip
          overwrite: true

      - name: Upload macOS CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-cli
          path: dist/NetSentinel-cli-macOS
          overwrite: true

  # ── Linux ──────────────────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libxcb-cursor0 libxcb1 libx11-6 \
            libgl1-mesa-glx libglib2.0-0 libdbus-1-3 \
            libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-xinerama0 libegl1 libegl-mesa0

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Pre-build smoke test
        run: python app.py --smoke

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -v --tb=short --cov=. --cov-report=html:htmlcov

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-linux
          path: htmlcov/
          if-no-files-found: ignore

      - name: Build Linux binary
        run: |
          pyinstaller NetSentinel.spec
          pyinstaller NetSentinelCLI.spec
          mv dist/NetSentinel-cli dist/NetSentinel-cli-linux

      - name: Make executable
        run: |
          chmod +x dist/NetSentinel
          chmod +x dist/NetSentinel-cli-linux

      - name: Post-build smoke test
        run: dist/NetSentinel --smoke

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-binary
          path: dist/NetSentinel
          overwrite: true

      - name: Upload Linux CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-cli
          path: dist/NetSentinel-cli-linux
          overwrite: true

  # ── GitHub Release (production) ───────────────────────────────────────────
  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write   # Sigstore OIDC for keyless cosign signing
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/

      - name: Resolve version
        id: ver
        run: |
          VER="${{ github.ref_name }}"
          VER="${VER#v}"
          echo "VERSION=$VER" >> "$GITHUB_OUTPUT"

      - name: Generate SHA256SUMS.txt
        run: |
          VER="${{ steps.ver.outputs.VERSION }}"
          cd artifacts
          # Collect all release files into a flat list and hash them
          find . -type f \( \
            -name "NetSentinel-Setup-*.exe" \
            -o -name "NetSentinel-*.msix" \
            -o -name "NetSentinel-svc.exe" \
            -o -name "NetSentinel-macOS.zip" \
            -o -name "NetSentinel-cli-macOS" \
            -o -name "NetSentinel" \
            -o -name "NetSentinel-cli-linux" \
          \) | while read -r f; do
            sha256sum "$f" | awk -v base="$(basename "$f")" '{print $1 "  " base}'
          done | sort > ../SHA256SUMS.txt
          echo "Generated SHA256SUMS.txt:"
          cat ../SHA256SUMS.txt

      - name: Sign Windows installer with cosign
        run: |
          VER="${{ steps.ver.outputs.VERSION }}"
          INSTALLER="artifacts/windows-installer/NetSentinel-Setup-${VER}.exe"
          if [ -f "$INSTALLER" ]; then
            cosign sign-blob \
              --yes \
              --bundle "NetSentinel-Setup-${VER}.exe.bundle" \
              "$INSTALLER"
            echo "Signed: $INSTALLER"
          else
            echo "Installer not found — skipping cosign"
          fi

      - name: Sign MSIX artifact with cosign
        run: |
          VER="${{ steps.ver.outputs.VERSION }}"
          MSIX="artifacts/windows-msix/NetSentinel-${VER}.msix"
          if [ -f "$MSIX" ]; then
            cosign sign-blob \
              --yes \
              --bundle "NetSentinel-${VER}.msix.bundle" \
              "$MSIX"
            echo "Signed: $MSIX"
          else
            echo "MSIX not found — skipping cosign"
          fi

      - name: Delete existing release for this tag if present
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete "${{ github.ref_name }}" --yes 2>/dev/null || true

      - name: Build release body from README changelog
        run: python scripts/extract_changelog.py "${{ steps.ver.outputs.VERSION }}"

      - name: Create GitHub Release
        id: gh_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: "NetSentinel ${{ github.ref_name }}"
          draft: false
          prerelease: false
          body_path: release_body.md
          files: |
            artifacts/windows-installer/NetSentinel-Setup-*.exe
            artifacts/windows-msix/NetSentinel-*.msix
            artifacts/windows-svc/NetSentinel-svc.exe
            artifacts/macos-app/NetSentinel-macOS.zip
            artifacts/macos-cli/NetSentinel-cli-macOS
            artifacts/linux-binary/NetSentinel
            artifacts/linux-cli/NetSentinel-cli-linux
            SHA256SUMS.txt
            NetSentinel-Setup-*.exe.bundle
            NetSentinel-*.msix.bundle

      - name: Submit to VirusTotal
        id: vt
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          VER="${{ steps.ver.outputs.VERSION }}"
          DL_URL="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/NetSentinel-Setup-${VER}.exe"
          python scripts/vt_scan.py "$DL_URL"

      - name: Prepend security section to release body
        # Runs regardless of the VT step's outcome (RULE-REL1) — a security section
        # that vanishes on exactly the runs where VT flagged something is worse than
        # one that always reports the real verdict.
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${{ steps.ver.outputs.VERSION }}"
          RELEASE_ID="${{ steps.gh_release.outputs.id }}"
          SHA256_URL="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/SHA256SUMS.txt"
          BUNDLE="NetSentinel-Setup-${VER}.exe.bundle"
          MSIX_BUNDLE="NetSentinel-${VER}.msix.bundle"
          VT_PERMALINK="${{ steps.vt.outputs.VT_PERMALINK }}"
          VT_STATUS="${{ steps.vt.outputs.VT_STATUS }}"
          VT_DETECTIONS="${{ steps.vt.outputs.VT_DETECTIONS }}"
          VT_ENGINES="${{ steps.vt.outputs.VT_ENGINES }}"

          # Array, not a concatenated string — VT_ENGINES is a "; "-joined list of
          # engine names and can contain spaces, which unquoted word-splitting would
          # scatter across multiple argv entries.
          ARGS=("$RELEASE_ID" "$VER" "$SHA256_URL" --bundle-name "$BUNDLE" --msix-bundle-name "$MSIX_BUNDLE")
          if [ -n "$VT_PERMALINK" ]; then
            ARGS+=(--vt-permalink "$VT_PERMALINK")
          fi
          if [ -n "$VT_STATUS" ]; then
            ARGS+=(--vt-status "$VT_STATUS")
          fi
          if [ -n "$VT_DETECTIONS" ]; then
            ARGS+=(--vt-detections "$VT_DETECTIONS")
          fi
          if [ -n "$VT_ENGINES" ]; then
            ARGS+=(--vt-engines "$VT_ENGINES")
          fi

          python scripts/update_release_body.py "${ARGS[@]}"

  # ── WinGet submission ──────────────────────────────────────────────────────
  # Manifests are generated by `wingetcreate update` from the existing
  # winget-pkgs entry, not hand-authored here. This keeps the manifest
  # schema version and the installed wingetcreate CLI version from ever
  # drifting apart — the CLI always knows what schema it itself supports.
  winget:
    needs: [release]
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Install wingetcreate
        shell: pwsh
        run: winget install --id Microsoft.Wingetcreate --source winget --silent --accept-package-agreements --accept-source-agreements

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v', ''
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT

      - name: Update and submit winget manifest
        shell: pwsh
        env:
          WINGET_PAT: ${{ secrets.WINGET_PAT }}
        run: |
          $ver = "${{ steps.ver.outputs.VERSION }}"
          $url = "https://github.com/${{ github.repository }}/releases/download/v${ver}/NetSentinel-Setup-${ver}.exe"
          # Inno Setup launcher stubs are always x86 PE binaries regardless of
          # ArchitecturesInstallIn64BitMode, so the architecture must be forced
          # to match the existing x64 manifest entry (wingetcreate won't guess
          # across a mismatch).
          #
          # wingetcreate's first call reads the current manifest straight from
          # the GitHub REST API (not a git clone), which occasionally gets
          # bounced by GitHub's secondary rate limiting ("gitmon refuses to
          # schedule us: fail-fast:network", HTTP 429). That's transient, so
          # retry a few times with backoff before failing the job.
          $maxAttempts = 5
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            wingetcreate update NetSentinel.NetSentinel --version $ver --urls "$url|x64|inno|machine" --submit --token $env:WINGET_PAT
            if ($LASTEXITCODE -eq 0) {
              break
            }
            if ($attempt -eq $maxAttempts) {
              Write-Error "wingetcreate failed after $maxAttempts attempts"
              exit $LASTEXITCODE
            }
            $delay = 30 * $attempt
            Write-Warning "wingetcreate failed (attempt $attempt/$maxAttempts, exit $LASTEXITCODE) - retrying in ${delay}s"
            Start-Sleep -Seconds $delay
          }
