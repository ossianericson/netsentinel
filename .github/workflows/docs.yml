name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install MkDocs
        run: pip install mkdocs-material

      # Strict build first: fails the job on a broken internal link or a page that
      # resolves nowhere, so a dead site can never deploy green. gh-deploy alone
      # reports success even when every cross-reference on the site is a 404.
      - name: Build (strict)
        run: mkdocs build --strict --site-dir _strict_check

      - name: Verify no internal docs in build output
        run: |
          if find _strict_check \( -path '*/internal/*' -o -path '*/spikes/*' \) | grep -q .; then
            echo "::error::Engineering-internal docs leaked into the public site build"
            find _strict_check \( -path '*/internal/*' -o -path '*/spikes/*' \)
            exit 1
          fi
          echo "OK — no internal/ or spikes/ pages in build output"

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force
